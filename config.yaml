# ============================================================================
# PRISM-benchmarks — single source of truth for every script.
# Every dataset/render/adapter/eval/report script reads THIS file.
# Label everything "preliminary": few scenes, fixed seed, no variance study yet.
# ============================================================================

hardware:
  hw_id: "RTX PRO 6000"      # stamped into perf tables; we benchmark on the 6000 only
  device: cuda

# ── Datasets ────────────────────────────────────────────────────────────────
# ScanNet++ is the starting dataset (go straight to ++; higher-fidelity meshes).
# KITTI-360 (outdoor, fisheye->equirect) + Matterport3D & Stanford2D3D
# (panorama-native equirectangular RGB-D with GT) added as they come online.
datasets:
  active: [replica]          # TODAY: Replica (no approval). Later: scannetpp, kitti360, ...
  seed: 1234                 # legacy single seed (used if `seeds` is absent)
  # Variance study: each scene×traj×rate is rendered once per seed, and the seeds
  # inside a (scene, traj-family, rate) cell are the repeats the error bars come from.
  # 2 seeds gives each cell's variance 1 d.o.f. — enough to pool across cells, not
  # enough to quote a converged interval. The 2026-07 run's seed-to-seed spread on ATE
  # was 25-60% of the mean, wide enough to swallow several between-method gaps, so the
  # publication matrix runs 3 — enough to pool a real within-cell variance (2 gives
  # each cell 1 d.o.f.), without the 4th seed's +33% on a matrix that is already ~13 h.
  # Add 3456 back if the error bars still overlap where it matters.
  seeds: [1234, 5678, 9012]
  root: dataset/raw

  replica:                   # fastest zero-approval indoor meshes (NICE-SLAM/iMAP standard)
    kind: mesh_render        # render pano + pinhole from the scene mesh (textured)
    root: dataset/raw/replica
    up_axis: auto            # detect up as the shortest AABB extent (room height); rotate to Z-up
    scenes: []               # frozen by make_split
    n_scenes_start: 6        # big benchmark: 6 rooms (small offices + large apartments)
    # Pinned into every split BEFORE the random draw. The 2026-07 matrix drew its
    # scenes uniformly and landed on four large multi-room apartments + a hotel with
    # NO small room, making every absolute number pessimistic and incomparable to the
    # small-room numbers the literature reports. room_0 and office_0 are the two
    # smallest Replica rooms; pinning them makes the difficulty spread a property of
    # the config rather than of the RNG.
    must_include: [room_0, office_0]
    mesh_glob: "*/mesh.ply"

  scannetpp:
    kind: mesh_render        # render pano + pinhole from the scene mesh
    root: dataset/raw/scannetpp
    scenes: []               # frozen list; start with ONE room (make_split fills this)
    n_scenes_start: 1
    mesh_glob: "*/scans/mesh_aligned_0.05.ply"

  kitti360:
    kind: fisheye_stitch     # stitch the 2 fisheye cams -> equirect for ours; perspective for baselines
    root: dataset/raw/kitti360
    sequences: []            # one short sequence to start (stretch)

  matterport3d:
    kind: equirect_native    # already equirectangular RGB-D + GT geometry
    root: dataset/raw/matterport3d
    scenes: []

  stanford2d3d:
    kind: equirect_native
    root: dataset/raw/stanford2d3d
    scenes: []

# ── Camera models ─────────────────────────────────────────────────────────────
# Rendered from the SAME poses so any metric gap is method, not data.
camera:
  pano:
    width: 1036
    height: 518
    projection: equirect     # matches the live PRISM config
  pinhole:
    # Two intrinsics variants are rendered & benchmarked SEPARATELY so we can
    # report both a "fairest common FOV" number and a "real-sensor intrinsics"
    # number (see docs/decisions.md, D7).
    variants:
      synthetic_fov:         # a fixed, fair FOV shared across datasets
        width: 640
        height: 480
        fov_deg: 90
      real_intrinsics:       # reuse the dataset's own perspective K when it has one
        use_dataset_k: true
  camera_height_m: 1.7       # PRISM metric-scale anchor (known robot camera height)

# ── Trajectories (both variants rendered) ─────────────────────────────────────
trajectories:
  variants: [synthetic_spline]   # (+ dataset_path once the per-dataset pose importer lands)
  # CEILING: max frames even if speed/rate would give more.
  #
  # This was 200, chosen because "full-batch baselines are near the VRAM limit at 200".
  # That capped the sequence length of EVERY method to protect the offline ones — which
  # penalises exactly the property the streaming engines exist for. A bounded-memory
  # streamer looks unremarkable when nothing is allowed to get long enough to exhaust
  # memory.
  #
  # 600 deliberately runs past the full-batch ceiling. Feed-forward methods (Pi3,
  # MapAnything, PanoVGGT) are EXPECTED to OOM on the longer / denser sequences, and an
  # OOM is now RECORDED as a first-class result (perf.json `oom` + `failure_kind`,
  # reported in the capacity table) rather than counted as a failed run. That is the
  # cleanest evidence for the paper's central claim; LASER's KITTI table does the same
  # thing, reporting VGGT / Pi3 / Fast3R as OOM on every sequence.
  #
  # 300 is the chosen operating point. Cost scales linearly in frames AND seeds; at
  # 600 frames x 4 seeds the matrix was ~39 h of GPU and ~427 GB of exports (estimated
  # by fitting wall = load + b*frames per method on the 2026-07 runs). The shipped
  # matrix -- 300 frames, 3 seeds, no stop-and-go, no guard arms, 16-bit PNG depth --
  # is 792 runs at ~10 h and ~30 GB, and still lengthens the 5 Hz sequences over the 200
  # cap — those were already being truncated at ~196-198 frames, so this is where the
  # extra length actually lands.
  #
  # The exact OOM/capacity limits come from the dedicated prefix sweep
  # (`make capacity-sweep`) rather than from this matrix: it finds each method's real
  # OOM frame count on one scene instead of only telling you "it OOMed at 300".
  # Natural OOMs here are still recorded (perf.json `oom`, capacity.csv).
  n_frames: 300
  # RATE SWEEP: one trajectory per capture rate -> traj id "synthetic_<rate>hz".
  # Low rate = sparse, wide-baseline (favours feed-forward); high rate = dense overlap
  # (favours streaming, and pushes full-batch toward the VRAM ceiling).
  # baseline (inter-frame distance) = speed/rate — THIS is what drives quality, not FPS:
  #   2.0 Hz -> 0.25 m,  5.0 Hz -> 0.10 m  (at speed 0.5 m/s)
  #
  # 0.5 Hz REMOVED after the 2026-08-09 run. It was not measuring capture rate, it was
  # measuring near-absence of data: a 1.0 m spacing over a room-sized circuit produced
  # 6-to-21-frame sequences. Below PRISM's 16-frame window the alignment arms are inert
  # (PRISM_ALIGN is only consulted from the 2nd window), and three office_0 runs failed
  # Umeyama outright with "Degenerate covariance rank". Nothing about a method was
  # observable there. If the wide-baseline regime is wanted back, get it by raising the
  # walking speed at a fixed rate, not by starving the sequence.
  rates_hz: [2.0, 5.0]       # SMOOTH baseline gets the rate sweep
  synthetic_spline:
    speed_mps: 0.5           # constant walking speed; inter-frame baseline = speed/rate
    min_clearance_m: 0.30    # collision-free sampling against the mesh occupancy
    loop: false
    # ── Reaching n_frames (see dataset/trajectories.py::synthetic_spline) ──
    # Sequence length is path_len * rate / speed, so n_frames used to only TRUNCATE.
    # These are the levers that lengthen the path, cheapest distortion first.
    n_waypoints: 12          # lever 1: a longer circuit (was 8) — costs nothing
    min_span_m: 3.0          # waypoints must SPAN the room, not cluster (office_0 guard)
    max_laps: 4              # lever 2: repeat the circuit; keeps the baseline exact,
                             #   but adds revisits — say so when reporting loop closure
    min_speed_mps: 0.15      # lever 3: slow the walk; changes the baseline, last resort
    min_frames: 32           # hard floor — refuse to emit a stationary "trajectory"

  # NEW trajectory families for the big benchmark (each renders as '<kind>_<rate>hz[_sN]').
  # They run at 2 Hz only (the new axis is the MOTION pattern, not the rate) to bound
  # runtime. These are the paths designed to STRESS streaming drift & the guards:
  #   stopgo — walk, stand still (dwell), walk again → noise accumulation + still-guard
  #   loop   — return to & re-observe the start → loop-closure / drift-correction test
  # STOP-AND-GO IS DISABLED for the publication run (2026-08-09). It is the most
  # expensive family relative to what it buys right now: it costs ~3.7 h of GPU on
  # its own, plus it is the only stressor the guard ablation arms exist for. PRISM
  # collapses on it (masked F 0.717 -> 0.088 vs ~2x degradation for every baseline)
  # and that is a real, unexplained result — but it is not diagnosed, so it is being
  # omitted from the paper rather than reported half-understood.
  # Re-enable by uncommenting; nothing else needs to change.
  extra_kinds:
    # stopgo: {rates_hz: [2.0], n_stops: 2, dwell_s: 5.0}
    loop:   {rates_hz: [2.0]}

# ── PRISM engine knobs (mirror the live/report config) ────────────────────────
engine:
  window_size: 16
  overlap: 4
  voxel_size: 0.02
  max_depth: 4.5
  face_size: 768
  processing_mode: parallel
  tsdf_prune_radius: 0       # full accumulation for quality runs

# ── Streaming harness ─────────────────────────────────────────────────────────
# We test STREAMING performance. Every method is driven incrementally (frame- or
# window-fed); non-streaming methods are windowed to match. Full-batch runs are
# NOT benchmarked (that would only measure the underlying feed-forward net).
streaming:
  enabled: true
  feed: window               # window | frame
  window_size: 16
  overlap: 4

# ── Methods under test (each a submodule + adapter; run in its OWN env) ────────
# stream=true means the method is evaluated in the streaming harness.
# metric=true means the method produces metric-scale output (else scale-free ->
# Sim(3)+scale alignment for traj, and it is excluded from absolute-scale accuracy).
# mode: stream = native online SLAM (fed incrementally); batch = feed-forward, all frames
# in one pass (permutation-equivariant nets like Pi3/MapAnything — windowing misaligns them).
methods:
  # DEPLOYED DEFAULT = Sim(3), set explicitly here rather than inherited from the
  # engine's own default, so the arm's identity is pinned by the benchmark config and
  # cannot drift if the PRISM repo changes its default. Basis: the alignment study
  # (SL(4) is better on open paths but loses decisively on loops — ATE 110 vs 102 cm,
  # F 0.26 vs 0.34, scale 31% vs 20% — and real deployments loop).
  # NOTE FOR ANYONE READING OLD RESULTS: in the 2026-07 archive the arm named `prism`
  # was SL(4). From this config forward `prism` is Sim(3) and SL(4) lives in the
  # `prism_sl4` ablation arm. eval/aggregate_clean.py carries an era map for this.
  - {name: prism,       camera: pano,     env: submodules/PRISM-VGGT, mode: stream, metric: true,  role: ours, align_group: sim3, run_env: {PRISM_ALIGN: "sim3"}}
  - {name: panovggt,    camera: pano,     env: submodules/PRISM-VGGT, mode: batch,  metric: false, role: reference}  # raw backbone, full-batch 360° (no PRISM engine) — shows what the engine adds
  - {name: pi3,         camera: pinhole,  env: submodules/Pi3,        mode: batch,  metric: true,  role: baseline}   # Pi3X: approx metric scale
  - {name: mapanything, camera: pinhole,  env: submodules/map-anything, mode: batch, metric: true, role: baseline}  # feed-forward metric
  - {name: vggtslam,    camera: pinhole,  env: submodules/VGGT-SLAM,  mode: stream, metric: false, role: baseline}
  - {name: laser,       camera: pinhole,  env: submodules/LASER,      mode: stream, metric: false, role: baseline}   # training-free streaming (wraps Pi3); pinhole

# Feed-forward baselines process every frame at once. `max_frames` would subsample to
# keep them under the VRAM ceiling — deliberately left null so they are NOT protected:
# we want the real capacity limit, recorded. Set it only if you need a run to complete
# for some other reason, and say so in the paper if you do.
baselines:
  max_frames: null

# ── PRISM ablations (engine-contribution study) ───────────────────────────────
# Each is a PRISM run (runner: prism) with engine behaviour toggled via run_env. They
# appear as their own "methods" in the results/report. `make ablations` runs them all.
#
# Two families:
#  (a) GUARD ablations — toggle the drift-control guards (env-only).
#  (b) ALIGNMENT-GROUP ablations — the core novelty study. PRISM_ALIGN switches the
#      submap registration group: sim3 (default, = the plain `prism` run, 7-DoF),
#      se3 (6-DoF rigid at locked scale), sl4 (15-DoF projective, VGGT-SLAM's group).
#      The report's "Alignment study" table compares them on quality AND compute cost.
ablations:
  #  GUARD ARMS DISABLED alongside stop-and-go. The still-guard's only stressor is
  #  dwelling, so with stopgo off these three arms measure nothing new — and the
  #  2026-07 result was already an honest negative ("no measurable accuracy benefit",
  #  guards ON 83.9 cm ATE vs OFF 81.2). Keeping them would cost ~3.7 h to re-confirm
  #  a null. Re-enable together with stopgo if the guard study goes back in the paper.
  # - {name: prism_nolock,   camera: pano, env: submodules/PRISM-VGGT, mode: stream, metric: true, role: ablation, runner: prism, run_env: {LOCK_SCALE_AFTER_FIRST: "0"}}
  # - {name: prism_nostill,  camera: pano, env: submodules/PRISM-VGGT, mode: stream, metric: true, role: ablation, runner: prism, run_env: {PRISM_STILL_GUARD: "0"}}
  # - {name: prism_noguards, camera: pano, env: submodules/PRISM-VGGT, mode: stream, metric: true, role: ablation, runner: prism, run_env: {LOCK_SCALE_AFTER_FIRST: "0", PRISM_STILL_GUARD: "0", PRISM_FLIP_GUARD: "0", PRISM_Z_RELEVEL: "0"}}
  # Alignment-group study. `prism` (main) is Sim(3) — the deployed default — so the
  # arms below measure the OTHER two groups against it (PRISM_ALIGN switch in the
  # PRISM repo). Every arm names its group explicitly; none relies on a repo default.
  - {name: prism_sl4,      camera: pano, env: submodules/PRISM-VGGT, mode: stream, metric: true, role: ablation, runner: prism, align_group: sl4,  run_env: {PRISM_ALIGN: "sl4"}}
  - {name: prism_se3,      camera: pano, env: submodules/PRISM-VGGT, mode: stream, metric: true, role: ablation, runner: prism, align_group: se3,  run_env: {PRISM_ALIGN: "se3"}}
  #  (c) VGGT-SLAM FAIRNESS arms — the baseline in both configurations, so the paper can
  #      show the head-to-head against VGGT-SLAM's *native* mode (loop closure ON, its
  #      headline feature) rather than only against the hobbled OFF mode used in 2026-07.
  #      Named arms, not a mutable global, so a results tree is always self-describing.
  - {name: vggtslam_noloop, camera: pinhole, env: submodules/VGGT-SLAM, mode: stream, metric: false, role: baseline, runner: vggtslam, run_env: {VGGTSLAM_MAX_LOOPS: "0"}}
  - {name: vggtslam_loop,   camera: pinhole, env: submodules/VGGT-SLAM, mode: stream, metric: false, role: baseline, runner: vggtslam, run_env: {VGGTSLAM_MAX_LOOPS: "1"}}
  #  (d) FIDELITY-vs-MEMORY SWEEP (PRISM only). The engine's voxel size and max_depth
  #      are the two knobs that trade map fidelity against memory, and PRISM is the only
  #      method here that HAS such a knob — the feed-forward baselines have exactly one
  #      operating point, at 25-45 GB. So this is not a defence against "are you
  #      handicapped by a 2 cm voxel", it is a result: a bounded-memory engine exposes an
  #      operating curve. Overrides go through PRISM_VOXEL_SIZE / PRISM_MAX_DEPTH, read
  #      only by prism_runner, because cfg.engine.voxel_size is ALSO used by
  #      panovggt/pi3 for their fusion dedup and sweeping it would move the baselines.
  #      `prism` itself (voxel 0.02, max_depth 4.5) is the reference point on the curve.
  #      These run on a REDUCED scene/traj set (see scripts/run_overnight.sh Phase 5),
  #      not the whole matrix, and are excluded from the headline tables.
  - {name: prism_vox010,  camera: pano, env: submodules/PRISM-VGGT, mode: stream, metric: true, role: sweep, runner: prism, run_env: {PRISM_ALIGN: "sim3", PRISM_VOXEL_SIZE: "0.01"}}
  - {name: prism_vox040,  camera: pano, env: submodules/PRISM-VGGT, mode: stream, metric: true, role: sweep, runner: prism, run_env: {PRISM_ALIGN: "sim3", PRISM_VOXEL_SIZE: "0.04"}}
  - {name: prism_vox080,  camera: pano, env: submodules/PRISM-VGGT, mode: stream, metric: true, role: sweep, runner: prism, run_env: {PRISM_ALIGN: "sim3", PRISM_VOXEL_SIZE: "0.08"}}
  - {name: prism_depth30, camera: pano, env: submodules/PRISM-VGGT, mode: stream, metric: true, role: sweep, runner: prism, run_env: {PRISM_ALIGN: "sim3", PRISM_MAX_DEPTH: "3.0"}}
  - {name: prism_depth60, camera: pano, env: submodules/PRISM-VGGT, mode: stream, metric: true, role: sweep, runner: prism, run_env: {PRISM_ALIGN: "sim3", PRISM_MAX_DEPTH: "6.0"}}
  #      A matched-window arm kept for the ablation story: same submap size as OUR
  #      engine window (16). It is NOT the published configuration — cite vggtslam
  #      (w=32) for the head-to-head and use this only to show the effect of w.
  - {name: vggtslam_w16,    camera: pinhole, env: submodules/VGGT-SLAM, mode: stream, metric: false, role: ablation,  runner: vggtslam, run_env: {VGGTSLAM_SUBMAP_SIZE: "16", VGGTSLAM_MAX_LOOPS: "1"}}

# VGGT-SLAM (streaming) tuning — drives its own main.py.
#
# CONFIGURED TO MATCH THE PUBLISHED PAPER, not to match our window. Rationale: any
# claim of the form "PRISM beats VGGT-SLAM" has to be against VGGT-SLAM as published,
# otherwise a reviewer reads it as a strawman. From the VGGT-SLAM paper (NeurIPS 2025,
# arXiv:2505.12549) and its 2.0 follow-up (arXiv:2601.19887):
#
#   * submap size w = 32 is the HEADLINE configuration for every published number
#     (7-Scenes avg ATE 0.067 m; TUM avg ATE 0.053 m for the SL(4) variant). The
#     w-sweep in their appendix shows w matters a lot: TUM SL(4) goes 0.115 (w=8)
#     -> 0.083 (w=16) -> 0.053 (w=32). Running w=16 costs them ~55% ATE, unprompted.
#     Our previous `submap_size: 16` ("matches our window") was therefore handing
#     them a materially worse configuration than they publish.
#   * min_disparity 50 px is the repo default and is what VGGT-SLAM 2.0 states it
#     uses ("the same parameter used by VGGT-SLAM for minimum disparity (50 pixels)").
#     The 1.0 paper text says 25 px; we follow the repo + 2.0, and record it.
#   * They average over >= 5 runs because RANSAC makes the method stochastic. Our
#     seeds give us repeats, but note the variation is the METHOD's, not just the
#     scene's.
#
# DEGENERACY GUARD: with w=32, a sequence must yield >32 keyframes before a SECOND
# submap exists — and with only one submap there is no inter-submap SL(4)
# registration and no loop closure, i.e. the entire method is inactive. The runner
# now parses the submap/loop-closure counts out of the log and writes them to
# arm_config.json, and warns loudly when submaps < 2. Check that before citing.
vggtslam:
  max_loops: 1               # loop closure ON (its native mode). 0 disables.
  submap_size: 32            # PUBLISHED headline config (was 16 = our window size)
  min_disparity: 50          # repo default + VGGT-SLAM 2.0; the 1.0 paper text says 25
# PanoVGGT-no-SLAM ablation intentionally EXCLUDED: full-batch of ours = benchmarking
# PanoVGGT alone, not the streaming engine. (Decision 2026-07-13.)

# ── Evaluation ────────────────────────────────────────────────────────────────
eval:
  fscore_threshold_m: 0.05
  mask:
    mode: rigorous           # rigorous (GT-depth occlusion) | containment
    frustum_far_m: 4.5
    occlusion_tol_m: 0.05
  align:
    type: sim3               # monocular convention; Umeyama with scale
    correct_scale: true      # recon QUALITY is scale-normalised so scale-free methods compare fairly
  icp:
    enabled: true            # refine pred->GT registration with ICP before scoring recon
    max_dist_m: 0.15
  metric_accuracy:
    enabled: true            # OUR benchmark: absolute-scale error vs. rendered GT
    # measured only for methods with metric=true (prism, mapanything); others N/A
  cleanliness:               # cloud sharpness/size — captures "fluffy floaters" F-score misses
    noise_threshold_m: 0.10  # a pred point > this from GT counts as a noise floater
    precision_threshold_m: 0.02   # tight precision (pred within 2 cm of GT surface)

# ── Report ────────────────────────────────────────────────────────────────────
report:
  label: preliminary
  out_dir: results/report
