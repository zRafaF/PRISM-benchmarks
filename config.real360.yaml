# ============================================================================
# REAL 360 deg data — 360Loc (CVPR 2024), decisions D31 (real360-v1: atrium ref only)
# and D35 (real360-v2: atrium + hall, 5 sequences each, see below). Overlay on config.yaml via
# PRISM_CONFIG_OVERLAY (scripts/real360.sh sets it). Nothing here touches the Replica
# matrix: separate dataset (`loc360`), separate input/result tag (`real360-v1`), and the
# Replica render settings / trajectory code are unchanged, so the rerun-v3 inputs stay
# valid.
#
#   PC : bash scripts/real360.sh download   # the scenes below, from the authors' links
#        bash scripts/real360.sh list       # which sequences a scene contains
#        bash scripts/real360.sh inputs     # import -> export -> pack (inputs/real360-v1)
#        bash scripts/real360.sh push
#   pod: bash scripts/real360.sh pod        # quick check: 5 arms on the sequences below
# ============================================================================

datasets:
  active: [loc360]
  seeds: [1234]                  # one seed: recorded sequences have no random draw
  loc360:
    kind: real_pano
    root: dataset/raw/360loc     # <root>/<scene>/... as unzipped from 360Loc
    # 360Loc has 4 scenes (one zip each). v1 used ATRIUM only (indoor, static). v2 adds
    # HALL (outdoor courtyard, static): PRISM runs there with a 10 m depth cap and 8 cm
    # voxels (methods.scene_env below) and the co-visibility mask uses 10 m
    # (eval.mask.frustum_far_m_by_scene). Still excluded: concourse (crowded: moving
    # people, no single static map), piatrium (half outdoor, not downloaded).
    scenes: [atrium, hall]
    # traj id -> sequence folder inside the scene (relative path; `list` shows them).
    # `mapping` = the daytime reference sequence (581 images in atrium). If the scene
    # stores it in sub-folders, point at the one you want, e.g. mapping/<name>.
    # Only the reference sequence ships 360 depth maps, from which the GT map is built
    # (gt_map below). More daytime sequences of the same scene (query_360/daytime_360_1,
    # _2: other routes, same map coordinates) can be added as e.g. `day1:
    # query_360/daytime_360_1` and to trajectories.sequences — import `ref` first so the
    # GT map exists; their reconstruction is then scored against that map, but without
    # depth maps of their own they get no co-visibility mask (full-360 score only).
    # v2: every 360 sequence of each scene — the mapping route and the four query routes
    # (two daytime, two at night; other paths through the same building, GT poses in
    # the same map frame). Only `ref` has depth maps: the others are scored against the
    # GT map built from `ref` and take its camera height (import_360loc.py).
    sequences:
      ref: mapping
      day1: query_360/daytime_360_1
      day2: query_360/daytime_360_2
      night1: query_360/nighttime_360_1
      night2: query_360/nighttime_360_2
    # Frames used: the longest continuous segment (a jump > max_step_m, default
    # max(1 m, 8 x median step), splits the sequence), every `stride`-th image, at most
    # `max_frames`. The importer prints the path length and step statistics.
    stride: 1
    max_frames: null
    max_step_m: null
    # Camera height above the floor (PRISM's metric anchor). null = from the dataset's
    # 360 depth maps (straight-down depth), else a point cloud; set a number to override.
    # (hall measured ~1.9 m: the rig is held above the operator's head.)
    camera_height_m: null
    # 360Loc depth maps are 16-bit PNG in centimetres (checked: two frames' depth clouds
    # align under the GT poses at 0.01, not at 0.005 or 0.02). Used for the camera height.
    depth_scale: 0.01
    # Rotate each panorama (and its GT) so the image centre looks along the direction of
    # travel: the pinhole "front" view then looks forward, like a robot camera.
    align_heading: true
    heading_smooth_frames: 5
    # The person holding the rig is in every panorama, behind and below the camera (after
    # align_heading: always at the back). Blacked out in the panorama before any view is
    # resampled, and invalid in every mask — same pixels lost for every method.
    # Sectors in degrees from the back direction; latitudes in degrees (0 = horizon).
    # GT reference map for the reconstruction scores: the 360Loc depth maps are rendered
    # from the authors' lidar map, so fusing them with the GT poses rebuilds that map
    # (every pixel_step-th pixel, up to max_range_m from each camera, voxel_m dedup).
    gt_map:
      pixel_step: 4
      max_range_m: 10.0
      voxel_m: 0.02
    operator_mask:
      back_halfwidth_deg: 55     # head + torso: back +-55 deg, below top_lat_deg
      top_lat_deg: -8
      arms_halfwidth_deg: 85     # arms: back +-85 deg, below arms_top_lat_deg
      arms_top_lat_deg: -35
      nadir_lat_deg: -65         # everything below -65 deg (hands, rig)

trajectories:
  rates_hz: []                   # no generated walks: the recorded sequences only
  extra_kinds: {}
  sequences: [ref, day1, day2, night1, night2]

# real360-v2 (D35): one run per method and sequence, streaming methods only.
#  - prism: as on Replica (Sim(3), free scale); 4 cm voxels (atrium TSDF at 2 cm ran out
#    of GPU memory, v1); hall (outdoor): 10 m cap, 8 cm voxels.
#  - prism_h090 / prism_h110: camera height told to the engine x0.9 / x1.1 (sensitivity of
#    the metric anchor; ref sequences only: `only_trajs`).
#  - laser: saves its per-frame depth (LASER_SAVE_DEPTH) so that eval/fuse_tsdf.py can
#    fuse it through a TSDF at PRISM's voxel size and cap -> arm `laser_tsdf` (same
#    back-end control, written by scripts/real360.sh right after the run).
#  - vggtslam: pinhole, as on Replica.
# Dropped from v1: the cube-face arms (vggtslam_cube, laser_cube) — on the atrium they
# were worse than or no better than the pinhole arms (real360-v1); the Replica cube-face
# control stays in the paper. Offline methods: not run here (best case = Replica + the
# v1 atrium runs).
methods:
  - {name: prism,      camera: pano,    env: submodules/PRISM-VGGT, mode: stream, metric: true,  role: ours, align_group: sim3, run_env: {PRISM_ALIGN: "sim3", PRISM_SCALE_MODE: "free", PRISM_VOXEL_SIZE: "0.04"}, scene_env: {hall: {PRISM_MAX_DEPTH: "10.0", PRISM_VOXEL_SIZE: "0.08"}}}
  - {name: prism_h090, camera: pano,    env: submodules/PRISM-VGGT, mode: stream, metric: true,  role: ablation, runner: prism, align_group: sim3, only_trajs: [ref], run_env: {PRISM_ALIGN: "sim3", PRISM_SCALE_MODE: "free", PRISM_VOXEL_SIZE: "0.04", PRISM_HEIGHT_SCALE: "0.9"}, scene_env: {hall: {PRISM_MAX_DEPTH: "10.0", PRISM_VOXEL_SIZE: "0.08"}}}
  - {name: prism_h110, camera: pano,    env: submodules/PRISM-VGGT, mode: stream, metric: true,  role: ablation, runner: prism, align_group: sim3, only_trajs: [ref], run_env: {PRISM_ALIGN: "sim3", PRISM_SCALE_MODE: "free", PRISM_VOXEL_SIZE: "0.04", PRISM_HEIGHT_SCALE: "1.1"}, scene_env: {hall: {PRISM_MAX_DEPTH: "10.0", PRISM_VOXEL_SIZE: "0.08"}}}
  - {name: laser,      camera: pinhole, env: submodules/LASER,      mode: stream, metric: false, role: baseline, run_env: {LASER_SAVE_DEPTH: "1"}}
  - {name: vggtslam,   camera: pinhole, env: submodules/VGGT-SLAM,  mode: stream, metric: false, role: baseline}
ablations: []

baselines:
  run: false

report:
  label: "REAL 360 (360Loc) — atrium + hall, 5 sequences each (real360-v2)"

eval:
  mask:
    frustum_far_m_by_scene: {hall: 10.0}
